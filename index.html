    <div class="desktop-shell">

        <p class="eyebrow">需求 4 · 库存确认</p>
        <h1>把库存去向<br />确认到每件商品</h1>
        <p class="guide-copy">
          从「我的」进入库存确认，搜索订单或商品，确认机器人未能定位的商品是否已回到货架。
        </p>
        <div class="guide-rule">
          <span>01</span>
          <p><strong>已放回架上</strong><br />模拟释放占用库存</p>
        </div>
        <div class="guide-rule">
          <span>02</span>
          <p><strong>没找到，也不在货架上</strong><br />模拟系统临时盘点扣除</p>
        </div>
        <p class="guide-note">
          示例数据与处理结果只存在当前页面内。刷新即可重置，不触碰真实库存。
        </p>
